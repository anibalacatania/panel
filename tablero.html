<!DOCTYPE html>
<html>
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="robots" content="noindex"/>
  <script src="vendor/js/jquery.min.js"></script>
  <link href="vendor/css/shiny.min.css" rel="stylesheet"/>
  <link href="vendor/css/bootstrap.min.css" rel="stylesheet"/>
  <script src="vendor/js/bootstrap.min.js"></script>
  <link href="vendor/css/selectize.bootstrap3.css" rel="stylesheet"/>
  <script src="vendor/js/selectize.min.js"></script>

<body>
  <div class="container-fluid">

        <form class="well" role="complementary">

          <h6>LibreSense R package</h6>
          <em><h6>https://github.com/ anibalacatania/LibreSense</h6></em>
          <h6>catania.anibal@inta.gob.ar</h6>
          <h5>INTA EEA Mendoza</h5>
          <h5 id="nombre-panel" style="font-weight:bold"></h5>
          <div id="qrcode" class="shiny-plot-output"></div>
          <div id="sesion"></div>
        </form>
      </div>
      <div class="col-sm-8" role="main">
        <div class="tabbable">
          <ul class="nav nav-tabs" data-tabsetid="5310">
            <li class="active"><a href="#tab-5310-1" data-toggle="tab" data-value="Datos">Datos</a></li>
            <li><a href="#tab-5310-2" data-toggle="tab" data-value="ACP">ACP</a></li>
            <li><a href="#tab-5310-3" data-toggle="tab" data-value="Cajas">Cajas</a></li>

            <li><a href="#tab-5310-5" data-toggle="tab" data-value="Radar">Radar</a></li>
          </ul>

            <div class="tab-pane active" data-value="Datos" id="tab-5310-1">
              <h1>Datos</h1><br/>
              <div id="data" class="shiny-html-output"></div>
            </div>
            <div class="tab-pane" data-value="ACP" id="tab-5310-2">
              <h1>ACP</h1><br/>
              <div id="answer_acp" class="shiny-plot-output"></div>
            </div>
            <div class="tab-pane" data-value="Cajas" id="tab-5310-3">
              <h1>Cajas</h1><br/>

                <label class="control-label" id="attribute_selector-label" for="attribute_selector">Atributo</label>
                <div><select id="attribute_selector" class="shiny-input-select"></select></div>
              </div>
              <div id="answer_box" class="shiny-plot-output"></div>

            <div class="tab-pane" data-value="Anova" id="tab-5310-4">

                <label class="control-label" id="attribute_selector_2-label" for="attribute_selector_2">Atributo</label>

              </div>
              <div id="answer_anova" class="shiny-plot-output"></div>
            </div>
            <div class="tab-pane" data-value="Radar" id="tab-5310-5">
              <h1>Radar</h1><br/>
              <div id="answers_radar" class="shiny-plot-output"></div>
