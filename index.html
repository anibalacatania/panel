<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="robots" content="noindex"/>
  <script src="vendor/js/jquery.min.js"></script>
  <link href="vendor/css/shiny.min.css" rel="stylesheet"/>
  <link href="vendor/css/cyborg.min.css" rel="stylesheet"/>
  <script src="vendor/js/bootstrap.min.js"></script>
  <link href="vendor/css/ion.rangeSlider.css" rel="stylesheet"/>
  <script src="vendor/js/ion.rangeSlider.min.js"></script>
  <link href="vendor/css/selectize.bootstrap3.css" rel="stylesheet"/>
  <script src="vendor/js/selectize.min.js"></script>
  <style>
    /* lo mismo que agrega Shiny para que el select ocupe el ancho del contenedor */
    .selectize-control { margin-bottom: 0; }
    .shiny-input-container .selectize-input.disabled { cursor: default; }
  </style>
</head>
<body>
  <div class="container-fluid" align="center">
    <div class="form-group shiny-input-container">
      <label class="control-label" id="panelist_name-label" for="panelist_name">Panelista</label>
      <input id="panelist_name" type="text" class="form-control shinyjs-disabled" value="" disabled="disabled"/>
    </div>
    <div class="form-group shiny-input-container">
      <label class="control-label" id="product-label" for="product"></label>
      <div>
        <select id="product" class="shiny-input-select shinyjs-disabled" disabled="disabled"></select>
      </div>
    </div>
    <div id="attributes" class="shiny-html-output"></div>
    <button id="submit" type="button" class="btn btn-default action-button">Enviar</button>
  </div>
  <script>
    // Deshabilita la navegación del navegador (igual que run_panel).
    history.pushState(null, document.title, location.href);
    window.addEventListener('popstate', function () {
      history.pushState(null, document.title, location.href);
    });
  </script>
  <script type="module" src="js/panelista.js"></script>
</body>
</html>
